      - 'task-pack-core.js'
      - 'task-pack-ui.js'
      - 'task-pack-ui.css'
      - 'tests/test_task_pack.cjs'
      - 'task-planning-core.js'
      - 'task-planning-ui.js'
      - 'task-planning-ui.css'
      - 'tests/test_task_planning.cjs'
      - 'todoist-sync.js'
      - 'task-projects-core.js'
      - 'task-projects.css'
      - 'tests/test_task_projects.cjs'
      - 'tests/test_task_projects_ui.cjs'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/task-projects.yml'

permissions:
  contents: read

jobs:
  task-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse task project modules and PWA bootstrap
        run: |
          node --check task-projects-core.js
          node --check task-projects.js
          node --check task-progress-core.js
          node --check task-session-review.js
          node --check time.js
          node --check universal-timers.js
          node --check activity-log.js
          node --check task-planning-core.js
          node --check task-planning-ui.js
          node --check task-pack-core.js
          node --check task-pack-ui.js
          node --check task-work-windows-core.js
          node --check task-work-windows.js
          node --check task-wizard.js
          node --check task-free-days-core.js
          node --check task-free-days.js
          node --check task-focus-core.js
          node --check living-companion-core.js
          node --check living-companion.js
          node --check bakugo-visual-map.js
          node --check story-ui.js
          node --check living-companion-personality.js
          node --check life-hub-v314dk.js
          node --check habits.js
          node --check task-google-calendar-core.js
          node --check task-google-calendar.js
          node --check my-week.js
          node --check todoist-sync.js
          node --check service-worker.js
      - name: Test calendar math, optional branches and safe saves
        run: |
          node tests/test_task_projects.cjs
          node tests/test_task_progress.cjs
          node tests/test_task_projects_ui.cjs
          node tests/test_task_planning.cjs
          node tests/test_task_pack.cjs
          node tests/test_task_work_windows.cjs
          node tests/test_task_free_days.cjs
          node tests/test_task_focus.cjs
          TZ=Europe/Berlin node tests/test_living_companion.cjs
          node tests/test_living_companion_personality.cjs
          node tests/test_bakugo_visual_map.cjs
          TZ=Europe/Berlin node tests/test_task_google_calendar.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test with synthetic tasks
        run: python -m unittest discover -s tests -p 'test_task_projects_browser.py' -v
      - name: Confirm assets are wired into document and offline cache
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('service-worker.js','utf8');
          for (const asset of ['task-projects-core.js','task-projects.css']) {
            if (!html.includes(asset+'?v=0.31.4-task-projects1') || !sw.includes(asset+'?v=0.31.4-task-projects1')) throw Error('Asset not registered: '+asset);
          }
          if (!html.includes('id="taskProjectMount"') || !html.includes('id="taskProjectTodayMount"')) throw Error('Task project mount missing');
          for (const asset of ['task-planning-core.js','task-planning-ui.css']) {
            if (!html.includes(asset+'?v=0.31.4-task-planning2') || !sw.includes(asset+'?v=0.31.4-task-planning2')) throw Error('Asset not registered: '+asset);
          }
          if(html.includes('id="todoistPageMount"'))throw Error('Legacy Todoist mount should no longer exist in native task page');
          if(!html.includes('id="taskPlanningPanel"')||!html.includes('id="taskPlanningTodayMount"'))throw Error('New native task mounts missing');
          for (const asset of ['task-pack-core.js','task-pack-ui.js','task-pack-ui.css']) {
            if (!html.includes(asset+'?v=0.31.4-private-pack1') || !sw.includes(asset+'?v=0.31.4-private-pack1')) throw Error('Private task import asset missing: '+asset);
          }
          if(!html.includes('id="taskPackMount"'))throw Error('Private import mount missing');
          for (const asset of ['task-work-windows-core.js','task-work-windows.js','task-work-windows.css']) {
            if (!html.includes(asset+'?v=0.31.4-work-windows1') || !sw.includes(asset+'?v=0.31.4-work-windows1')) throw Error('Task window asset missing: '+asset);
          }
          for (const asset of ['task-wizard.js','task-wizard.css']) {
            if (!html.includes(asset+'?v=0.31.4-wizard1') || !sw.includes(asset+'?v=0.31.4-wizard1')) throw Error('Wizard asset missing: '+asset);
          }
          for (const id of ['taskWizardMount','taskWorkWindowsMount','taskWorkWindowsWeekMount'])
            if (!html.includes('id="'+id+'"')) throw Error('Missing UI mount: '+id);
          for (const [asset,ver] of [
            ['task-free-days-core.js','0.31.4-freedays1'],['task-free-days.css','0.31.4-freedays1'],
            ['task-google-calendar-core.js','0.31.4-gcal1'],['task-google-calendar.js','0.31.4-gcal1'],['task-google-calendar.css','0.31.4-gcal1']])
            if(!html.includes(asset+'?v='+ver)||!sw.includes(asset+'?v='+ver))throw Error('Missing calendar/free-day asset '+asset);
          for (const id of ['taskFreeDayMount','taskGoogleCalendarMount'])
            if (!html.includes('id="'+id+'"')) throw Error('Missing companion mount: '+id);
          for (const [asset,version] of [
            ['living-companion-personality.js','0.31.4-lc4'],
            ['living-companion.js','0.31.4-bakugo-seven1'],
            ['bakugo-visual-map.js','0.31.4-bakugo-hero-seven1'],
            ['story-ui.js','0.31.4-bakugo-hero-seven1'],
            ['living-world-v3.js','0.31.4-bakugo-seven1'],
            ['living-companion.css','0.31.4-lc4'],
            ['life-hub-v314dk.js','0.31.4-home-toast4']
          ]) {
            if(!html.includes(asset+'?v='+version)||!sw.includes(asset+'?v='+version))throw Error('Missing Companion/Home asset '+asset);
          }
          for (const asset of ['task-focus-core.js','task-focus.css']) {
            if(!html.includes(asset+'?v=0.31.4-focus1') || !sw.includes(asset+'?v=0.31.4-focus1'))throw Error('Focus companion asset missing: '+asset);
          }
          for (const asset of ['task-progress-core.js','task-projects.js','task-session-review.js','task-session-review.css',
            'task-free-days.js','task-planning-ui.js','time.js','my-week.js','universal-timers.js','activity-log.js']) {
            if(!html.includes(asset+'?v=0.31.4-task-time2') || !sw.includes(asset+'?v=0.31.4-task-time2')) throw Error('Task/time asset missing: '+asset);
          }
          if(!html.includes('id="taskSessionActiveMount"'))throw Error('Task timer status mount missing');
          console.log('Task project assets and mounts registered');
          NODE
