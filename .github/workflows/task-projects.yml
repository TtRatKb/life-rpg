      - 'living-companion.css'
      - 'habits.js'
      - 'tests/test_living_companion.cjs'
      - 'task-focus.css'
      - 'tests/test_task_focus.cjs'
      - 'task-free-days.css'
      - 'task-google-calendar-core.js'
      - 'task-google-calendar.js'
      - 'task-google-calendar.css'
      - 'tests/test_task_free_days.cjs'
      - 'tests/test_task_google_calendar.cjs'
      - 'docs/TASK_GOOGLE_CALENDAR_READONLY.md'
      - 'tests/test_task_work_windows.cjs'
      - 'my-week.js'
