      - 'tests/test_bakugo_visual_map.cjs'
      - 'living-companion-personality.js'
      - 'life-hub-v314dk.js'
      - 'tests/test_living_companion_personality.cjs'
      - 'living-companion.css'
      - 'habits.js'
      - 'tests/test_living_companion.cjs'
      - 'task-focus.css'
      - 'tests/test_task_focus.cjs'
      - 'task-free-days.css'
