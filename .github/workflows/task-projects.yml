  push:
    branches: [main]
    paths:
      - 'task-projects.js'
      - 'task-progress-core.js'
      - 'task-session-review.js'
      - 'task-session-review.css'
      - 'time.js'
      - 'universal-timers.js'
      - 'activity-log.js'
      - 'tests/test_task_progress.cjs'
      - 'task-work-windows-core.js'
      - 'task-work-windows.js'
      - 'task-work-windows.css'
      - 'task-wizard.js'
      - 'task-wizard.css'
      - 'task-free-days-core.js'
      - 'task-free-days.js'
      - 'task-focus-core.js'
      - 'living-companion-core.js'
      - 'living-companion.js'
      - 'bakugo-visual-map.js'
      - 'story-ui.js'
      - 'living-world-v3.js'
      - 'daily.js'
      - 'relationship-engine.js'
      - 'companion-moments.js'
      - 'companion-moments-v2.js'
