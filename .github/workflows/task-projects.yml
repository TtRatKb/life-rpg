permissions:
  contents: read

jobs:
  task-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse task project modules and PWA bootstrap
        run: |
          node --check task-projects-core.js
          node --check life-board-core.js
          node --check life-board.js
          node --check task-projects.js
          node --check task-progress-core.js
          node --check task-session-review.js
          node --check time.js
          node --check universal-timers.js
          node --check activity-log.js
          node --check task-planning-core.js
          node --check task-planning-ui.js
          node --check task-pack-core.js
          node --check task-pack-ui.js
          node --check task-work-windows-core.js
          node --check task-work-windows.js
          node --check task-wizard.js
          node --check task-free-days-core.js
          node --check task-free-days.js
          node --check task-focus-core.js
          node --check living-companion-core.js
          node --check living-companion.js
          node --check bakugo-visual-map.js
          node --check kirishima-visual-map.js
          node --check story-ui.js
          node --check living-companion-personality.js
          node --check life-hub-v314dk.js
          node --check habits.js
          node --check task-google-calendar-core.js
          node --check task-google-calendar.js
          node --check my-week.js
          node --check todoist-sync.js
          node --check service-worker.js
          node --check library.js
          node --check daily.js
          node --check shop.js
      - name: Test calendar math, optional branches and safe saves
        run: |
          node tests/test_task_projects.cjs
          node tests/test_life_board.cjs
          node tests/test_task_progress.cjs
          node tests/test_task_projects_ui.cjs
          node tests/test_task_planning.cjs
          node tests/test_task_pack.cjs
          node tests/test_task_work_windows.cjs
          node tests/test_task_free_days.cjs
          node tests/test_task_focus.cjs
          TZ=Europe/Berlin node tests/test_living_companion.cjs
          node tests/test_living_companion_personality.cjs
          node tests/test_bakugo_visual_map.cjs
          node tests/test_kirishima_visual_map.cjs
          node tests/test_reading_library.cjs
          TZ=Europe/Berlin node tests/test_task_google_calendar.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      # Retired task UI must not be brought back by an old smoke test.
      # The source-level task data/rollback tests above are retained for legacy saves.
      - name: Browser smoke test for reading formats
        run: python -m unittest discover -s tests -p 'test_reading_library_browser.py' -v
      - name: Browser smoke test for direct Journal reflection and lossless reload
        run: python -m unittest discover -s tests -p 'test_journal_book_browser.py' -v
      - name: Upload actual Soft Floral Journal browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-floral-journal-browser-screenshots
          path: test-artifacts/journal-soft-floral-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload actual editable art journal browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasmine-art-journal-browser-screenshots
          path: test-artifacts/journal-art-v*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify current app hides retired task/companion and preserves Nonogram/Journal wiring
        run: node tests/test_cozy_cleanup_nono_journal.cjs
